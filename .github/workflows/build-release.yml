name: Build, test and prepare release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to prepare, for example v0.1.0-preview.1 (use an unused version for a new draft)'
        required: true
        type: string
      create_draft:
        description: 'Create a new GitHub draft release after checks pass (main only)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      GOTOOLCHAIN: local
      RELEASE_VERSION: ${{ inputs.version }}
      CREATE_DRAFT: ${{ inputs.create_draft }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: true
      - name: Check release inputs
        shell: pwsh
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            python -c "import sys; sys.path.insert(0, 'tools'); from release_support import version; import os; version(os.environ['RELEASE_VERSION'])"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($env:CREATE_DRAFT -eq 'true' -and $env:GITHUB_REF -ne 'refs/heads/main') {
              throw 'Create drafts from main. Other branches can prepare artifacts with create_draft disabled.'
            }
          }
      - name: Check release tooling
        run: python -m unittest discover -s tests -p "test_release*.py" -v
      - name: Build and test
        shell: pwsh
        run: |
          $buildArgs = @()
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $buildArgs = @() + @('--version', $env:RELEASE_VERSION)
          }
          python tools/ci_build.py @buildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64-package
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Record result
        shell: pwsh
        run: |
          @'
          Build and offline tests passed. Download the package from this run's Artifacts when present.
          Live Steam transport and multi-PC gameplay require separate validation.
          '@ >> $env:GITHUB_STEP_SUMMARY

  draft:
    if: github.event_name == 'workflow_dispatch' && inputs.create_draft
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-x64-package
          path: dist
      - name: Create draft without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python tools/draft_release.py --version "$RELEASE_VERSION" --revision "$GITHUB_SHA"
